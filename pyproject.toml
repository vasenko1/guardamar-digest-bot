[project]
name = "guardamar-digest"
version = "0.1.0"
description = "Monthly Telegram digest with live Bot API collection and JSON fallback"
requires-python = ">=3.9"
dependencies = [
  # Android/Termux installations may not ship the IANA timezone database.
  # zoneinfo transparently uses this package when system data is unavailable.
  "tzdata>=2024.1",
]

[project.scripts]
guardamar-digest = "guardamar_digest.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
